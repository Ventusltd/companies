name: 202608300435 Five-hour Companies key-only Atlas watchdog
run-name: Companies key-only Atlas check ${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300435-five-hour-key-only-atlas-watchdog.yml'
  workflow_dispatch:
  schedule:
    - cron: '50 4-8 30 8 *'

permissions:
  contents: read

concurrency:
  group: companies-five-hour-key-only-atlas-watchdog
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MISSION_INCEPTED_AT: '2026-08-30T03:30:00Z'
  MISSION_EXPIRES_AT: '2026-08-30T08:35:00Z'
  ATLAS_STATE_URL: https://ventusltd.github.io/gridatlas/state/live-set.json
  MINIMUM_ATLAS_GENERATION: '202608292311'
  COMPANIES_CONTRACT: contracts/202608281337-compact-parquet-companies.json
  LINK_CONTRACT: state/atlas-v9-link-contract.json
  LINK_AUDIT: state/atlas-v9-link-audit.json

jobs:
  verify:
    name: Prove three-key columns, one URL template and no personal or raw corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Enforce bounded five-hour mission window
        id: window
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          expires="$(date -u -d "$MISSION_EXPIRES_AT" +%s)"
          if (( now > expires )); then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo "Companies five-hour key-only mission retired at $MISSION_EXPIRES_AT; no mutation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Checkout exact Companies source
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          persist-credentials: false

      - name: Resolve exact promoted GridAtlas receiver
        if: steps.window.outputs.active == 'true'
        id: atlas
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$ATLAS_STATE_URL" -o work/atlas-live-set.json
          python3 -m json.tool work/atlas-live-set.json >/dev/null
          generation="$(jq -r '.generation' work/atlas-live-set.json)"
          release_id="$(jq -r '.current.release_id' work/atlas-live-set.json)"
          live_url="$(jq -r '.current.live_url' work/atlas-live-set.json)"
          [[ "$generation" =~ ^[0-9]{12}$ ]]
          (( 10#$generation >= 10#$MINIMUM_ATLAS_GENERATION ))
          [[ "$release_id" =~ ^[0-9]{12}-atlas-v9$ ]]
          test "$live_url" = "https://ventusltd.github.io/gridatlas/$release_id/"
          test "$(jq -r '.verification.promotion_eligible' work/atlas-live-set.json)" = true
          test "$(jq -r '.verification.failed_gates' work/atlas-live-set.json)" = 0
          test "$(jq -r '.verification.commit_lineage_attested' work/atlas-live-set.json)" = true
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "live_url=$live_url" >> "$GITHUB_OUTPUT"

      - name: Prove compact relationship and privacy contract
        if: steps.window.outputs.active == 'true'
        env:
          ATLAS_RELEASE_ID: ${{ steps.atlas.outputs.release_id }}
          ATLAS_LIVE_URL: ${{ steps.atlas.outputs.live_url }}
        run: |
          set -euo pipefail
          test -f "$COMPANIES_CONTRACT"
          test -f "$LINK_CONTRACT"
          test -f "$LINK_AUDIT"
          test "$(jq -r '.schema' "$COMPANIES_CONTRACT")" = companies-house-relationship-report-contract-v1
          test "$(jq -r '.duckdb_version' "$COMPANIES_CONTRACT")" = 1.3.2
          test "$(jq -r '.hard_gates.compression' "$COMPANIES_CONTRACT")" = ZSTD
          test "$(jq -r '.hard_gates.bridge_columns_per_table' "$COMPANIES_CONTRACT")" = 3
          test "$(jq -r '.hard_gates.descriptive_edge_columns' "$COMPANIES_CONTRACT")" = 0
          test "$(jq -r '.hard_gates.row_level_provenance_columns' "$COMPANIES_CONTRACT")" = 0
          test "$(jq -r '.hard_gates.per_row_digest_columns' "$COMPANIES_CONTRACT")" = 0
          test "$(jq -r '.hard_gates.raw_archives' "$COMPANIES_CONTRACT")" = 0
          test "$(jq -r '.hard_gates.company_master_files' "$COMPANIES_CONTRACT")" = 0
          test "$(jq -r '.hard_gates.promotion_eligible' "$COMPANIES_CONTRACT")" = false
          test "$(jq -c '[.relationship_schema[].name]' "$COMPANIES_CONTRACT")" = '["company_number","repd_ref","evidence_type"]'
          test "$(jq -c '[.solar_relationship_schema[].name]' "$COMPANIES_CONTRACT")" = '["company_number","repd_ref","evidence_type"]'
          test "$(jq -r '.classification' "$LINK_CONTRACT")" = VERIFIED_KEY_ONLY_ATLAS_LINK_TEMPLATE
          test "$(jq -r '.atlas.release_id' "$LINK_CONTRACT")" = "$ATLAS_RELEASE_ID"
          test "$(jq -r '.atlas.base_url' "$LINK_CONTRACT")" = "$ATLAS_LIVE_URL"
          test "$(jq -r '.join.identity_rule' "$LINK_CONTRACT")" = EXACT_REPD_REF_ONLY
          test "$(jq -r '.relationship_tables.row_url_columns' "$LINK_CONTRACT")" = 0
          test "$(jq -c '.relationship_tables.columns' "$LINK_CONTRACT")" = '["company_number","repd_ref","evidence_type"]'
          test "$(jq -r '.privacy.personal_data' "$LINK_CONTRACT")" = false
          test "$(jq -r '.classification' "$LINK_AUDIT")" = PASS
          test "$(jq -r '.atlas_release_id' "$LINK_AUDIT")" = "$ATLAS_RELEASE_ID"
          test "$(jq -r '.row_url_columns' "$LINK_AUDIT")" = 0
          test "$(jq -r '.privacy' "$LINK_AUDIT")" = NO_PERSONAL_DATA
          test ! -e derived/atlas_v9_company_repd_links.parquet

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'schema': 'companies.five-hour-key-only-atlas-proof.v1',
              'classification': 'VERIFIED_KEY_ONLY_ATLAS_LINK_CONTRACT',
              'verified_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'atlas_release_id': os.environ['ATLAS_RELEASE_ID'],
              'atlas_live_url': os.environ['ATLAS_LIVE_URL'],
              'relationship_columns': ['company_number', 'repd_ref', 'evidence_type'],
              'row_url_columns': 0,
              'raw_archives': 0,
              'personal_data': False,
              'candidate_promotion_eligible': False,
          }
          Path('work/key-only-atlas-proof.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          PY
          {
            echo '## Companies key-only Atlas result'
            echo
            echo "- Atlas release: $ATLAS_RELEASE_ID"
            echo '- Relationship columns: company_number, repd_ref, evidence_type'
            echo '- URL columns per relationship row: 0'
            echo '- Raw archives: 0'
            echo '- Personal data: false'
            echo '- Candidate promotion eligible: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain key-only proof
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: companies-five-hour-key-only-${{ github.run_number }}-${{ github.sha }}
          path: |
            work/key-only-atlas-proof.json
            work/atlas-live-set.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
