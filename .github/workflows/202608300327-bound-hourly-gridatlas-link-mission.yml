name: 202608300327 Bound hourly Companies Atlas V9 mission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300327-bound-hourly-gridatlas-link-mission.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companies-bound-hourly-gridatlas-bootstrap
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TARGET: .github/workflows/202608300312-sync-gridatlas-v9-link-contract.yml
  MISSION_EXPIRES_AT: '2026-08-30T05:28:00Z'

jobs:
  delegate:
    name: Make the key-only Atlas link sync hourly and bounded
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Companies source boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: true

      - name: Patch only the CI conductor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/202608300312-sync-gridatlas-v9-link-contract.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "    - cron: '17,47 * * * *'",
                  "    - cron: '25 3-5 30 8 *'",
                  'bounded hourly cron',
              ),
              (
                  "  LINK_AUDIT: state/atlas-v9-link-audit.json\n",
                  "  LINK_AUDIT: state/atlas-v9-link-audit.json\n"
                  "  MISSION_EXPIRES_AT: '2026-08-30T05:28:00Z'\n",
                  'mission expiry',
              ),
              (
                  "      - name: Resolve verified Atlas receiver\n"
                  "        id: atlas\n"
                  "        run: |\n"
                  "          set -euo pipefail\n"
                  "          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \\\n",
                  "      - name: Resolve verified Atlas receiver\n"
                  "        id: atlas\n"
                  "        run: |\n"
                  "          set -euo pipefail\n"
                  "          now=\"$(date -u +%s)\"\n"
                  "          expires=\"$(date -u -d \"$MISSION_EXPIRES_AT\" +%s)\"\n"
                  "          if (( now > expires )); then\n"
                  "            echo 'ready=false' >> \"$GITHUB_OUTPUT\"\n"
                  "            echo \"Companies three-hour Atlas mission retired at $MISSION_EXPIRES_AT; no mutation.\" >> \"$GITHUB_STEP_SUMMARY\"\n"
                  "            exit 0\n"
                  "          fi\n"
                  "          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \\\n",
                  'mission window guard',
              ),
          ]

          for before, after, label in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -q "cron: '25 3-5 30 8 \*'" "$TARGET"
          grep -q "MISSION_EXPIRES_AT: '2026-08-30T05:28:00Z'" "$TARGET"
          test "$(grep -c 'Companies three-hour Atlas mission retired' "$TARGET")" = 1

      - name: Compare-and-swap the bounded conductor onto main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add "$TARGET"
          test "$(git diff --cached --name-only)" = "$TARGET"
          git config user.name companies-mission-conductor-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608300327: run key-only Atlas link closure hourly for three hours'
          git push origin HEAD:main
          {
            echo '## Companies mission delegated'
            echo
            echo '- Immediate key-only Atlas contract sync: triggered by this conductor update'
            echo '- Hourly follow-ups: 03:25, 04:25 and 05:25 UTC'
            echo '- Hard retirement: 05:28 UTC'
            echo '- Relationship tables changed: no'
            echo '- Raw Companies House data added: no'
            echo '- Personal data added: no'
          } >> "$GITHUB_STEP_SUMMARY"
