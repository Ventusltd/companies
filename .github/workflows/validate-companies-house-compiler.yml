name: Validate Companies House Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3 lxml==5.3.0
      - name: Compile Python sources
        run: python -m py_compile build/python/*.py tests/*.py
      - name: Prove source-plan rejection gates
        run: python tests/test_plan_companies_house_downloads.py
      - name: Prove bootstrap, quarterly, privacy and tamper gates
        run: python tests/test_compile_companies_house.py
