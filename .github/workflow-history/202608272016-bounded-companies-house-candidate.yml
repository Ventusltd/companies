name: 202608272016 Bounded Companies House Candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/202608272016-bounded-companies-house-candidate.yml
      - build/python/202608272016-freeze-companies-house-plan.py
      - build/python/202608272016-download-planned-archive.py
      - build/python/202608272016-extract-bounded-accounts.py
      - build/python/202608272016-verify-companies-house-candidate.py
      - tests/test_202608272016_document_ceiling.py
      - manifests/202608272016-bounded-companies-house-candidate.json
  workflow_dispatch:

concurrency:
  group: companies-house-candidate-202608272016
  cancel-in-progress: false

env:
  GENERATION: "202608272016"
  BASE_COMMIT: "cc61a74edea5321b9654a22af2e589a56c6dc19b"
  PIPELINENEWS_COMMIT: "35f35ada161223fb3ee19e525664ee7f17df1ddd"
  SOURCE_MANIFEST: manifests/202608272016-bounded-companies-house-candidate.json

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.boundary.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: boundary
        name: Prove immutable successor and inherited dependency closure
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          git diff --name-only "$BASE_COMMIT" HEAD | sort > /tmp/actual-files
          jq -r '.source_files[].path' "$SOURCE_MANIFEST" | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" -eq 7
          while IFS=$'\t' read -r expected path; do
            if [ "$expected" = "SELF" ]; then
              test "$path" = "$SOURCE_MANIFEST"
            else
              test "$(sha256sum "$path" | cut -d' ' -f1)" = "$expected"
            fi
          done < <(jq -r '[.source_files[],.dependencies[]] | .[] | [.sha256,.path] | @tsv' "$SOURCE_MANIFEST")
          test "$(jq -r '.generation' "$SOURCE_MANIFEST")" = "$GENERATION"
          test "$(jq -r '.base_commit' "$SOURCE_MANIFEST")" = "$BASE_COMMIT"
          test "$(jq -r '.deployment_state' "$SOURCE_MANIFEST")" = "not-authorised"
          test "$(jq -r '.usage_context' "$SOURCE_MANIFEST")" = "NON_COMMERCIAL_OPEN_SOURCE"
          test "$(jq -r '.source_licence.name' "$SOURCE_MANIFEST")" = "Open Government Licence v3.0"
          test "$(jq -r '.source_rights_are_distinct_from_usage_context' "$SOURCE_MANIFEST")" = true
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the pinned analytical verifier
        run: python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.3.2
      - name: Compile timestamped wrappers and boundary fixtures
        run: python -m py_compile build/python/202608272016-*.py tests/test_202608272016_document_ceiling.py
      - name: Run the inherited and successor deterministic contracts
        run: |
          python tests/test_202608271507_bounded_companies_house.py
          python tests/test_202608272016_document_ceiling.py

  plan:
    needs: [source-boundary, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      accounts: ${{ steps.matrix.outputs.accounts }}
      basic_index: ${{ steps.matrix.outputs.basic_index }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Freeze three accounts months and one basic snapshot
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          python build/python/202608272016-freeze-companies-house-plan.py \
            --output work/plan.json \
            --rest-evidence work/rest-evidence.json
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "accounts=$(jq -c '[.files | to_entries[] | select(.value.kind == "accounts") | {index:.key,filename:.value.filename}]' work/plan.json)" >> "$GITHUB_OUTPUT"
          echo "basic_index=$(jq -r '.files | to_entries[] | select(.value.kind == "basic") | .key' work/plan.json)" >> "$GITHUB_OUTPUT"
          test "$(jq '[.files[] | select(.kind == "accounts")] | length' work/plan.json)" -eq 3
          test "$(jq '[.files[] | select(.kind == "basic")] | length' work/plan.json)" -eq 1
          test "$(jq -r '.total_bytes <= .maximum_total_bytes' work/plan.json)" = true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companies-plan-202608272016
          path: |
            work/plan.json
            work/rest-evidence.json
          if-no-files-found: error
          retention-days: 1

  accounts-month:
    needs: [source-boundary, plan]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        archive: ${{ fromJson(needs.plan.outputs.accounts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: companies-plan-202608272016
          path: work
      - name: Download one exact planned archive
        run: |
          python build/python/202608272016-download-planned-archive.py \
            --plan work/plan.json \
            --index "${{ matrix.archive.index }}" \
            --output work/raw \
            --receipt "work/receipt-${{ matrix.archive.index }}.json"
      - name: Extract twice and prove compact record determinism
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find work/raw -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          python build/python/202608272016-extract-bounded-accounts.py --input "$archive" --output "work/accounts-${{ matrix.archive.index }}-a.ndjson" --report "work/extraction-${{ matrix.archive.index }}-a.json"
          python build/python/202608272016-extract-bounded-accounts.py --input "$archive" --output "work/accounts-${{ matrix.archive.index }}-b.ndjson" --report "work/extraction-${{ matrix.archive.index }}-b.json"
          cmp "work/accounts-${{ matrix.archive.index }}-a.ndjson" "work/accounts-${{ matrix.archive.index }}-b.ndjson"
          jq -S 'del(.completed_at)' "work/extraction-${{ matrix.archive.index }}-a.json" > work/report-a.json
          jq -S 'del(.completed_at)' "work/extraction-${{ matrix.archive.index }}-b.json" > work/report-b.json
          cmp work/report-a.json work/report-b.json
          mv "work/accounts-${{ matrix.archive.index }}-a.ndjson" "work/accounts-${{ matrix.archive.index }}.ndjson"
          mv "work/extraction-${{ matrix.archive.index }}-a.json" "work/extraction-${{ matrix.archive.index }}.json"
          rm -f "work/accounts-${{ matrix.archive.index }}-b.ndjson" "work/extraction-${{ matrix.archive.index }}-b.json" work/report-a.json work/report-b.json
      - name: Ensure the raw archive is not uploaded
        run: |
          test "$(find work/raw -type f -name '*.zip' | wc -l)" -eq 1
          find work/raw -type f -name '*.zip' -delete
          test "$(find work/raw -type f | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accounts-202608272016-${{ matrix.archive.index }}
          path: |
            work/accounts-${{ matrix.archive.index }}.ndjson
            work/receipt-${{ matrix.archive.index }}.json
            work/extraction-${{ matrix.archive.index }}.json
          if-no-files-found: error
          retention-days: 1

  compose:
    needs: [source-boundary, plan, accounts-month]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ventusltd/pipelinenews
          ref: ${{ env.PIPELINENEWS_COMMIT }}
          path: work/repd-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the pinned Parquet and DuckDB engine
        run: python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.3.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: companies-plan-202608272016
          path: work/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: accounts-202608272016-*
          path: work/months
          merge-multiple: true
      - name: Merge latest fact per company
        run: python build/python/202608262245-merge-accounts.py --input work/months --output work/accounts-latest.ndjson
      - name: Download and validate the planned basic snapshot
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608272016-download-planned-archive.py --plan work/plan/plan.json --index "${{ needs.plan.outputs.basic_index }}" --output work/basic/raw --receipt "work/months/receipt-${{ needs.plan.outputs.basic_index }}.json"
          archive="$(find work/basic/raw -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          python build/python/202608272016-extract-bounded-accounts.py --kind basic --input "$archive" --report work/months/basic-validation.json
      - name: Compile twice from identical frozen inputs
        run: |
          python build/python/202608262245-compile-companies-house.py --raw work/basic/raw --accounts work/accounts-latest.ndjson --repd work/repd-source/data/projects --output work/raw-a --stamp "$GENERATION"
          python build/python/202608262245-compile-companies-house.py --raw work/basic/raw --accounts work/accounts-latest.ndjson --repd work/repd-source/data/projects --output work/raw-b --stamp "$GENERATION"
      - name: Seal deterministic quarantined candidates
        run: |
          python build/python/202608272016-verify-companies-house-candidate.py --seal --input work/raw-a --output work/candidate-a --plan work/plan/plan.json --receipts work/months --reports work/months --repd work/repd-source/data/projects --basic work/basic/raw --accounts work/accounts-latest.ndjson --rest-evidence work/plan/rest-evidence.json --basic-report work/months/basic-validation.json --source-commit "${{ needs.source-boundary.outputs.source_sha }}"
          python build/python/202608272016-verify-companies-house-candidate.py --seal --input work/raw-b --output work/candidate-b --plan work/plan/plan.json --receipts work/months --reports work/months --repd work/repd-source/data/projects --basic work/basic/raw --accounts work/accounts-latest.ndjson --rest-evidence work/plan/rest-evidence.json --basic-report work/months/basic-validation.json --source-commit "${{ needs.source-boundary.outputs.source_sha }}"
          diff -qr work/candidate-a work/candidate-b
      - name: Independently verify quarantine
        run: |
          python build/python/202608272016-verify-companies-house-candidate.py --verify --input work/candidate-a --report work/verification-v1.json
          test "$(jq -r '.deployment_state' work/candidate-a/manifest-v1.json)" = "not-authorised"
          test "$(jq -r '.promotion_eligible' work/candidate-a/manifest-v1.json)" = false
          test "$(jq -r '.analytical_dataset.format' work/candidate-a/manifest-v1.json)" = parquet
          test "$(jq -r '.analytical_dataset.compression' work/candidate-a/manifest-v1.json)" = zstd
          test "$(jq -r '.analytical_dataset.rows == .analytical_dataset.distinct_keys' work/candidate-a/manifest-v1.json)" = true
          test "$(jq -r '.analytical_dataset.null_keys' work/candidate-a/manifest-v1.json)" -eq 0
          test "$(jq -r '.analytical_dataset.duplicate_key_groups' work/candidate-a/manifest-v1.json)" -eq 0
          test "$(jq -r '.data_discipline.owning_repository' work/candidate-a/manifest-v1.json)" = Ventusltd/companies
          test "$(jq -r '.data_discipline.foreign_data_copied' work/candidate-a/manifest-v1.json)" = false
          test "$(jq -r '.data_discipline | has("licensing_posture")' work/candidate-a/manifest-v1.json)" = false
          test "$(jq -r '.usage_context' work/candidate-a/manifest-v1.json)" = NON_COMMERCIAL_OPEN_SOURCE
          test "$(jq -r '.source_licence.name' work/candidate-a/manifest-v1.json)" = "Open Government Licence v3.0"
          test "$(jq -r '.source_rights_are_distinct_from_usage_context' work/candidate-a/manifest-v1.json)" = true
          test "$(jq -r '.status' work/candidate-a/parquet-audit-v1.json)" = PASS
          test ! -e data/current
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companies-candidate-202608272016
          path: |
            work/candidate-a/
            work/verification-v1.json
          if-no-files-found: error
          retention-days: 1

  publish-candidate-branch:
    needs: [source-boundary, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: companies-candidate-202608272016
          path: staged
      - name: Commit only the immutable timestamped candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-boundary.outputs.source_sha }}"
          if git ls-remote --exit-code --heads origin "refs/heads/candidate/$GENERATION" >/dev/null 2>&1; then
            echo "Immutable candidate branch already exists" >&2
            exit 1
          fi
          mkdir -p "data/candidates/$GENERATION"
          cp -R staged/candidate-a/. "data/candidates/$GENERATION/"
          git add "data/candidates/$GENERATION"
          test -n "$(git diff --cached --name-only)"
          while IFS= read -r path; do
            case "$path" in
              data/candidates/202608272016/*) ;;
              *) echo "Candidate commit escaped its boundary: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: quarantine Companies candidate $GENERATION"
          git push origin "HEAD:refs/heads/candidate/$GENERATION"
