name: 202608271634 Companies Candidate Semantics

on:
  workflow_dispatch:

concurrency:
  group: companies-candidate-semantics-202608271634
  cancel-in-progress: false

env:
  GENERATION: "202608271634"
  BASE_COMMIT: "4012964c3ab1e2f559e4836d697b99a74c7291e2"
  PARENT_GENERATION: "202608271547"
  SOURCE_MANIFEST: manifests/202608271634-companies-candidate-semantics.json

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.boundary.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - id: boundary
        name: Prove the four-file immutable source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          git diff --name-only "$BASE_COMMIT" HEAD | sort > /tmp/actual-files
          jq -r '.source_files[].path' "$SOURCE_MANIFEST" | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" -eq 4
          while IFS=$'\t' read -r expected path; do
            if [ "$expected" = "SELF" ]; then
              test "$path" = "$SOURCE_MANIFEST"
            else
              test "$(sha256sum "$path" | cut -d' ' -f1)" = "$expected"
            fi
          done < <(jq -r '[.source_files[],.dependencies[]] | .[] | [.sha256,.path] | @tsv' "$SOURCE_MANIFEST")
          test "$(jq -r '.generation' "$SOURCE_MANIFEST")" = "$GENERATION"
          test "$(jq -r '.base_commit' "$SOURCE_MANIFEST")" = "$BASE_COMMIT"
          test "$(jq -r '.deployment_state' "$SOURCE_MANIFEST")" = "not-authorised"
          test "$(jq -r '.usage_context' "$SOURCE_MANIFEST")" = "NON_COMMERCIAL_OPEN_SOURCE"
          test "$(jq -r '.source_licence' "$SOURCE_MANIFEST")" = "Open Government Licence v3.0"
          test "$(jq -r '.repository_boundary.successor_foreign_repository_access' "$SOURCE_MANIFEST")" = false
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the pinned Parquet verifier
        run: python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.3.2
      - name: Compile the successor source
        run: python -m py_compile build/python/202608271634-normalise-companies-candidate.py tests/test_202608271634_candidate_semantics.py
      - name: Run deterministic semantics, codec and divergence fixtures
        run: python tests/test_202608271634_candidate_semantics.py

  normalise:
    needs: [source-boundary, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: candidate/202608271547
          path: work/parent
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the pinned Parquet verifier
        run: python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.3.2
      - id: parent
        name: Freeze the same-repository parent candidate
        shell: bash
        run: |
          set -euo pipefail
          parent_commit="$(git -C work/parent rev-parse HEAD)"
          test "$(git -C work/parent rev-parse HEAD^)" = "$BASE_COMMIT"
          git -C work/parent diff --name-only "$BASE_COMMIT" "$parent_commit" | sort > /tmp/parent-files
          test -s /tmp/parent-files
          while IFS= read -r path; do
            case "$path" in
              data/candidates/202608271547/*) ;;
              *) echo "Parent candidate escaped its immutable path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/parent-files
          test -f work/parent/data/candidates/202608271547/manifest-v1.json
          test ! -e data/current
          echo "commit=$parent_commit" >> "$GITHUB_OUTPUT"
      - name: Build the semantics overlay twice
        run: |
          python build/python/202608271634-normalise-companies-candidate.py \
            --normalise \
            --parent work/parent/data/candidates/202608271547 \
            --output work/overlay-a \
            --parent-commit "${{ steps.parent.outputs.commit }}" \
            --source-manifest manifests/202608271547-bounded-companies-house-candidate.json
          python build/python/202608271634-normalise-companies-candidate.py \
            --normalise \
            --parent work/parent/data/candidates/202608271547 \
            --output work/overlay-b \
            --parent-commit "${{ steps.parent.outputs.commit }}" \
            --source-manifest manifests/202608271547-bounded-companies-house-candidate.json
          diff -qr work/overlay-a work/overlay-b
      - name: Independently verify the quarantined overlay
        run: |
          python build/python/202608271634-normalise-companies-candidate.py \
            --verify \
            --parent work/parent/data/candidates/202608271547 \
            --input work/overlay-a \
            --parent-commit "${{ steps.parent.outputs.commit }}" \
            --source-manifest manifests/202608271547-bounded-companies-house-candidate.json \
            --report work/overlay-verification.json
          test "$(jq -r '.deployment_state' work/overlay-a/manifest-v1.json)" = not-authorised
          test "$(jq -r '.promotion_eligible' work/overlay-a/manifest-v1.json)" = false
          test "$(jq -r '.usage_context' work/overlay-a/manifest-v1.json)" = NON_COMMERCIAL_OPEN_SOURCE
          test "$(jq -r '.source_licence' work/overlay-a/manifest-v1.json)" = "Open Government Licence v3.0"
          test "$(jq -r '.data_discipline | has("licensing_posture")' work/overlay-a/manifest-v1.json)" = false
          test "$(jq -r '.data_law.compression_codecs == ["ZSTD"]' work/overlay-a/verification-v1.json)" = true
          test "$(jq -r '.data_law.rows == .data_law.distinct_keys' work/overlay-a/verification-v1.json)" = true
          test "$(jq -r '.data_law.null_keys' work/overlay-a/verification-v1.json)" -eq 0
          test "$(jq -r '.data_law.duplicate_key_groups' work/overlay-a/verification-v1.json)" -eq 0
          test "$(jq -r '.data_law.json_record_universe_sha256 == .data_law.parquet_record_universe_sha256' work/overlay-a/verification-v1.json)" = true
          test ! -e data/current
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companies-candidate-semantics-202608271634
          path: |
            work/overlay-a/
            work/overlay-verification.json
          if-no-files-found: error
          retention-days: 1

  publish-candidate-branch:
    needs: [source-boundary, normalise]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-boundary.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: companies-candidate-semantics-202608271634
          path: staged
      - name: Commit only the immutable semantics overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-boundary.outputs.source_sha }}"
          test ! -e data/current
          if git ls-remote --exit-code --heads origin "refs/heads/candidate/$GENERATION" >/dev/null 2>&1; then
            echo "Immutable candidate branch already exists" >&2
            exit 1
          fi
          mkdir -p "data/candidates/$GENERATION"
          cp -R staged/overlay-a/. "data/candidates/$GENERATION/"
          git add "data/candidates/$GENERATION"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          while IFS= read -r path; do
            case "$path" in
              data/candidates/202608271634/*) ;;
              *) echo "Semantics overlay escaped its candidate path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: quarantine Companies semantics $GENERATION"
          git push origin "HEAD:refs/heads/candidate/$GENERATION"
